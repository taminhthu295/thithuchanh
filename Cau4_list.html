<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lí công nhân</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; }
        table { margin: 20px auto; border-collapse: collapse; width: 70%; }
        th, td { border: 1px solid #333; padding: 6px 10px; text-align: left; }
        th { background-color: #ccc; }
        tbody tr:nth-child(even) { background-color: #eee; }
    </style>
</head>
<body>
    <h2>Quản lí công nhân</h2>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Họ và tên</th>
                <th>Ngày sinh</th>
                <th>Địa chỉ</th>
                <th>Lương</th>
                <th>Chức vụ</th>
            </tr>
        </thead>
        <tbody id="danh-sach"></tbody>
    </table>

    <script>
        class CongNhan {
            constructor(stt, hoTen, ngaySinh, diaChi, luong, chucVu) {
                this.stt = stt;
                this.hoTen = hoTen;
                this.ngaySinh = ngaySinh;
                this.diaChi = diaChi;
                this.luong = luong;
                this.chucVu = chucVu;
            }
        }

        const danhSach = [
            new CongNhan(3, "Trương Tấn C", "1999-11-11", "Huế", 2000, "Abc"),
            new CongNhan(1, "Trương Tấn A", "1997-11-11", "Quảng Nam", 2000, "Abc"),
            new CongNhan(2, "Trương Tấn B", "1998-11-11", "Đà Nẵng", 2000, "Abc")
        ];

        function sapXepTheoHoTen(ds) {
            return [...ds].sort((a, b) => a.hoTen.localeCompare(b.hoTen, "vi"));
        }

        function dinhDangNgay(iso) {
            const [nam, thang, ngay] = iso.split("-");
            return `${ngay}-${thang}-${nam}`;
        }

        function hienThi(ds) {
            const tbody = document.getElementById("danh-sach");
            tbody.innerHTML = ds.map(cn => `
                <tr>
                    <td>${cn.stt}</td>
                    <td>${cn.hoTen}</td>
                    <td>${dinhDangNgay(cn.ngaySinh)}</td>
                    <td>${cn.diaChi}</td>
                    <td>${cn.luong}</td>
                    <td>${cn.chucVu}</td>
                </tr>`).join("");
        }

        hienThi(sapXepTheoHoTen(danhSach));
    </script>
</body>
</html>
